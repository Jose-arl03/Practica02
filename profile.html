<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photogram - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-camera-retro me-2"></i>Photogram
            </a>
            <div class="ms-auto">
                <a href="timeline.html" class="btn btn-outline-light">Timeline</a>
            </div>
        </div>
    </nav>

    <!-- Perfil Section -->
    <main class="container my-5">
        <div class="row">
            <!-- Información del Usuario -->
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <img src="https://picsum.photos/150/150" 
                             class="rounded-circle mb-3" 
                             alt="Foto de perfil">
                        <h4>@usuarioDemo</h4>
                        <p class="text-muted">Fotógrafo amateur</p>
                        <div class="d-flex justify-content-around mb-3">
                            <div>
                                <h5>1.2k</h5>
                                <small>Seguidores</small>
                            </div>
                            <div>
                                <h5>850</h5>
                                <small>Seguidos</small>
                            </div>
                        </div>
                        <a href="edit-profile.html" class="btn btn-primary w-100 mb-2">
                            <i class="fas fa-edit me-2"></i> Editar Perfil
                        </a>
                        <a href="settings.html" class="btn btn-outline-secondary w-100">
                            <i class="fas fa-cog me-2"></i> Configuración
                        </a>
                    </div>
                </div>
            </div>

            <!-- Galería de Publicaciones -->
            <div class="col-md-8">
                <h2 class="mb-4">Mis Publicaciones</h2>
                <div class="row row-cols-1 row-cols-md-2 g-4" id="userPosts">
                    <!-- Publicaciones generadas dinámicamente -->
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            generatePosts('userPosts', samplePosts.slice(0, 3));  // Cargar al menos 3 publicaciones
        });
    </script>
</body>
</html>
