<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photogram - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-camera-retro me-2"></i>Photogram
            </a>
            <div class="ms-auto">
                <a href="register.html" class="btn btn-outline-light">Registrarse</a>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg">
                        <div class="card-body p-5">
                            <h2 class="card-title text-center mb-4">Iniciar Sesión</h2>
                            <form id="loginForm">
                                <!-- Campo Usuario -->
                                <div class="mb-3">
                                    <label for="username" class="form-label">Usuario</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <input type="text" 
                                               class="form-control" 
                                               id="username" 
                                               placeholder="Ingresa tu usuario" 
                                               required>
                                    </div>
                                </div>

                                <!-- Campo Contraseña -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input type="password" 
                                               class="form-control" 
                                               id="password" 
                                               placeholder="Ingresa tu contraseña" 
                                               required>
                                    </div>
                                </div>

                                <!-- Recordar Usuario -->
                                <div class="mb-3 form-check">
                                    <input type="checkbox" 
                                           class="form-check-input" 
                                           id="remember">
                                    <label class="form-check-label" for="remember">
                                        Recordar usuario
                                    </label>
                                </div>

                                <!-- Botón de Iniciar Sesión -->
                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    Iniciar Sesión
                                </button>

                                <!-- Botón para ir al perfil directamente -->
                                <button type="button" class="btn btn-outline-secondary w-100 mb-3" onclick="window.location.href='profile.html'">
                                    Ir al Perfil
                                </button>

                                <!-- Enlaces Adicionales -->
                                <div class="text-center">
                                    <a href="register.html" class="text-decoration-none">
                                        ¿No tienes cuenta? Regístrate
                                    </a>
                                    <br>
                                    <a href="#" class="text-decoration-none">
                                        ¿Olvidaste tu contraseña?
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            $('#loginForm').submit(function(e) {
                e.preventDefault();

                const username = $('#username').val();
                const password = $('#password').val();

                // Validar campos vacíos
                if (!username || !password) {
                    alert('Por favor, completa todos los campos.');
                    return;
                }

                // Simular login exitoso
                if (username === 'demo' && password === 'demo123') {
                    alert('Inicio de sesión exitoso. Redirigiendo...');
                    window.location.href = 'profile.html';  // Redirigir a la página de perfil
                } else {
                    alert('Usuario o contraseña incorrectos.');
                }
            });
        });
    </script>
</body>
</html>
