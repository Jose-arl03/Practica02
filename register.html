<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photogram - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-camera-retro me-2"></i>Photogram
            </a>
            <div class="ms-auto">
                <a href="login.html" class="btn btn-outline-light">Iniciar Sesión</a>
            </div>
        </div>
    </nav>

    <!-- Registro Section -->
    <section class="register-section d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-lg">
                        <div class="card-body p-4">
                            <h2 class="card-title text-center mb-4">Regístrate en Photogram</h2>
                            <form id="registerForm">
                                <!-- Campo Usuario -->
                                <div class="mb-3">
                                    <label for="username" class="form-label">Usuario*</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <input type="text" 
                                               class="form-control" 
                                               id="username" 
                                               placeholder="Crea un nombre de usuario" 
                                               required>
                                    </div>
                                </div>

                                <!-- Campo Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email*</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-envelope"></i>
                                        </span>
                                        <input type="email" 
                                               class="form-control" 
                                               id="email" 
                                               placeholder="Ingresa tu correo electrónico" 
                                               required>
                                    </div>
                                </div>

                                <!-- Campo Contraseña -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña*</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input type="password" 
                                               class="form-control" 
                                               id="password" 
                                               placeholder="Crea una contraseña segura" 
                                               required>
                                    </div>
                                </div>

                                <!-- Campo Confirmar Contraseña -->
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña*</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input type="password" 
                                               class="form-control" 
                                               id="confirmPassword" 
                                               placeholder="Repite tu contraseña" 
                                               required>
                                    </div>
                                </div>

                                <!-- Campo Nombre -->
                                <div class="mb-3">
                                    <label for="firstName" class="form-label">Nombre*</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-id-card"></i>
                                        </span>
                                        <input type="text" 
                                               class="form-control" 
                                               id="firstName" 
                                               placeholder="Ingresa tu nombre" 
                                               required>
                                    </div>
                                </div>

                                <!-- Campo Apellidos -->
                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Apellidos</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-id-card"></i>
                                        </span>
                                        <input type="text" 
                                               class="form-control" 
                                               id="lastName" 
                                               placeholder="Ingresa tus apellidos">
                                    </div>
                                </div>

                                <!-- Campo Género -->
                                <div class="mb-3">
                                    <label for="gender" class="form-label">Género*</label>
                                    <select class="form-select" id="gender" required>
                                        <option value="">Selecciona tu género</option>
                                        <option value="Hombre">Hombre</option>
                                        <option value="Mujer">Mujer</option>
                                        <option value="No Aplica">No Aplica</option>
                                        <option value="Prefiero no Decirlo">Prefiero no Decirlo</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                    <input type="text" 
                                           class="form-control mt-2 d-none" 
                                           id="otherGender" 
                                           placeholder="Especifica tu género">
                                </div>

                                <!-- Campo Fecha de Nacimiento -->
                                <div class="mb-4">
                                    <label for="birthdate" class="form-label">Fecha de Nacimiento*</label>
                                    <input type="date" 
                                           class="form-control" 
                                           id="birthdate" 
                                           required>
                                </div>

                                <!-- Botón de Registro -->
                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    Registrarse
                                </button>

                                <!-- Enlace a Login -->
                                <div class="text-center">
                                    <a href="login.html" class="text-decoration-none">
                                        ¿Ya tienes una cuenta? Inicia Sesión
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
